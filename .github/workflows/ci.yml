name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check artifacts
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Pack and inspect tarball
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent | tail -n 1)"
          test -f "$TARBALL"
          echo "Packed $TARBALL"
          tar -tzf "$TARBALL" > package-files.txt
          cat package-files.txt
          for path in \
            package/lib/index.js \
            package/lib/client.js \
            package/cordis.patch.yml \
            package/README.md \
            package/LICENSE; do
            grep -qx "$path" package-files.txt
          done

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-better-choice-node${{ matrix.node }}-${{ matrix.os }}
          path: "*.tgz"
          if-no-files-found: error
